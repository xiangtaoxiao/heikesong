<script>
const data=[

['杀身成仁','《论语·卫灵公》','孔子说：志士仁人，不会为了活命而损害仁，只会牺牲生命来成全仁。','子曰：“志士仁人，无求生以害仁，有杀身以成仁。”'],
['以德报怨','《论语·宪问》','有人问：用恩德回报怨恨怎么样？孔子反问：那用什么来回报恩德？应该用正直回报怨恨，用恩德回报恩德。','或曰：“以德报怨，何如？”子曰：“何以报德？以直报怨，以德报德。”'],

async function fetchAgents(){

    for(let id of wanted){
      let a=(j.agents||[]).find(x=>x.agent_id===id);
      if(a){found.push(a);agentNames[id]=a.display_name}
    }
    agentIds=found.map(x=>x.agent_id);
    return found;
  }catch(e){
    agentIds=['aristotle','zhuangzi','hanfeizi','schopenhauer'];
    agentNames={aristotle:'亚里士多德',zhuangzi:'庄子',hanfeizi:'韩非子',schopenhauer:'叔本华'};
    return agentIds.map(id=>({agent_id:id,display_name:agentNames[id]}));
  }
}

function renderStory(){
  let s=data[n];$('#title').textContent=s[0];$('#source').textContent=s[1]+' · 圆桌讨论中';
  $('#num').textContent=String(n+1).padStart(2,'0');$('#story').textContent=s[2];
  updateProgress(n);
}

function updateProgress(idx){
  let bar=$('#progressBar');bar.innerHTML='';
  for(let i=0;i<10;i++){let d=document.createElement('span');d.className='dot'+(i<idx?' done':'')+(i===idx?' current':'');bar.appendChild(d)}
}

function renderTiles(speakingName=null){
  let s=data[n];let html='';
  html+=`<div class="tile host"><div class="tile-head"><span class="tile-avatar">🎙️</span><div><strong>主持人</strong><span class="tile-role"> · 会议主持</span></div></div><div class="tile-caption"><div class="screen-label">SCREEN SHARING · 论语原文</div><div class="screen-title">${s[0]}</div><div class="screen-source">${s[1]}</div><div class="screen-original">${s[3]}</div><div class="screen-story">${s[2]}</div></div><div class="tile-status">● 正在发言</div></div>`;
  let phils=['亚里士多德','庄子','韩非子','叔本华'];let emojis={'亚里士多德':'🧔','庄子':'🧑‍🎨','韩非子':'🧑‍⚖️','叔本华':'🧓'};
  for(let name of phils){let isSpeaking=name===speakingName;let text=philosopherTexts[name]||'等待发言';html+=`<div class="tile a ${isSpeaking?'speaking':''}"><div class="tile-head"><span class="tile-avatar">${emojis[name]}</span><div><strong>${name}</strong><span class="tile-role"> · 哲学家</span></div></div><div class="tile-face">${emojis[name]}</div><div class="tile-copy">${text}</div><div class="tile-status">${isSpeaking?'● 正在发言':'⌁ 静音'}</div></div>`;}
  html+=`<div class="tile player"><div class="tile-face">🧑</div><div class="tile-copy">你 — ${waitingForUser?'轮到你了':'正在聆听'}</div><div class="tile-status">⌁ ${waitingForUser?'可发言':'已加入'}</div></div>`;
  $('#grid').innerHTML=html;
}

function chat(name,msg){
  let e={'主持人':'🎙️','亚里士多德':'🧔','庄子':'🧑‍🎨','韩非子':'🧑‍⚖️','叔本华':'🧓','你':'🧑'}[name]||'💬';
  $('#chat').insertAdjacentHTML('beforeend',`<div class="chat-msg"><div class="chat-avatar">${e}</div><div><b>${name}</b><p>${msg}</p></div></div>`);
  let c=document.querySelector('.chat');c.scrollTop=c.scrollHeight;
}

function setUserInputEnabled(enabled){
  $('#input').disabled=!enabled;$('#input').placeholder=enabled?'写下你的想法，或选择参考观点':'等待哲学家发言中...';
  $('#skipBtn').disabled=!enabled;$('#skipBtn').className='skip'+(enabled?'':' loading');
  $('#sendBtn').disabled=!enabled;$('#sendBtn').className='send'+(enabled?'':' loading');
}

async function startSession(){
  if(!gameRunning)return;
  let s=data[n];let topic=s[0]+'：'+s[2];let sysPrompt=systemPrompts[n];
  let req={topic:topic,agent_ids:agentIds,rounds:20,start_round:currentRound,run_rounds:1,system_prompt:sysPrompt,history:history,mode:'roundtable'};
  if(sessionId)req.session_id=sessionId;
  waitingForUser=false;setUserInputEnabled(false);philosopherResponses=[];
  abortController=new AbortController();
  try{
    let resp=await fetch('/api/sessions/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req),signal:abortController.signal});
    if(!resp.ok){fallbackRound();return;}
    let reader=resp.body.getReader();let decoder=new TextDecoder();let buffer='';
    while(true){
      let {done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      let lines=buffer.split('\n');buffer=lines.pop()||'';
      let eventType='',eventData='';
      for(let line of lines){
        if(line.startsWith('event: '))eventType=line.slice(7).trim();
        else if(line.startsWith('data: '))eventData=line.slice(6).trim();
        else if(line==='' && eventType && eventData){handleSSEEvent(eventType,eventData);eventType='';eventData='';}
      }
    }
  }catch(e){
    if(e.name==='AbortError')return;
    console.warn('SSE error, using fallback:',e);
    fallbackRound();
  }
}

function handleSSEEvent(type,data){
  try{var d=JSON.parse(data)}catch(e){return}
  switch(type){
    case 'session_started':sessionId=d.session_id;break;
    case 'round_started':philosopherResponses=[];break;
    case 'agent_started':let name=agentNames[d.agent_id]||d.agent_id;renderTiles(name);break;
    case 'message':
      let msgName=agentNames[d.agent_id]||d.agent_id;let msgContent=d.content||'';
      philosopherTexts[msgName]=msgContent;philosopherResponses.push({name:msgName,text:msgContent});
      renderTiles(msgName);chat(msgName,msgContent);
      history.push({agent_id:d.agent_id,agent_name:msgName,role:'agent',content:msgContent,round_index:currentRound,model_id:d.model_id||''});
      break;
    case 'agent_skipped':let skipName=agentNames[d.agent_id]||d.agent_id;chat(skipName,'(本轮跳过发言)');break;
    case 'round_completed':
      waitingForUser=true;setUserInputEnabled(true);renderTiles(null,{});
      $('#input').focus();showSuggestions();
      break;
    case 'session_completed':break;
    case 'user_input_requested':
      if(!waitingForUser){waitingForUser=true;setUserInputEnabled(true);renderTiles(null,{});showSuggestions();}
      break;
    case 'error':console.error('Session error:',d.error);fallbackRound();break;
  }
}

function fallbackRound(){
  if(!gameRunning)return;
  let phils=['亚里士多德','庄子','韩非子','叔本华'];
  let texts1={'亚里士多德':'这个问题核心在于如何权衡。我们需要追问：什么情况下原则可以让步？','庄子':'角度不同，结论就不同。与其争对错，不如看看各自看到了什么。','韩非子':'现实从来不按理想剧本走。空谈道德不如正视利益冲突。','叔本华':'人总是被看不见的力量驱动。理性不过是欲望的遮羞布。'};
  let texts2={'亚里士多德':'你的观点很有启发性，但我们需要进一步追问：这个立场在实践中能否自洽？','庄子':'你说得对，但别忘了，任何立场都有其对立面。','韩非子':'理想很美好，但现实中的利益博弈才是决定因素。','叔本华':'你的思考暴露了人类理性的局限性——我们总在为自己的欲望找理由。'};
  let texts=storyPhase===0?texts1:texts2;
  philosopherResponses=[];let i=0;
  function speakNext(){
    if(!gameRunning||i>=phils.length){waitingForUser=true;setUserInputEnabled(true);renderTiles(null);$('#input').focus();showSuggestions();return;}
    let name=phils[i];let t=texts[name]||'这是一个值得思考的问题。';
    philosopherTexts[name]=t;philosopherResponses.push({name,text:t});
    renderTiles(name);chat(name,t);
    history.push({agent_id:name,agent_name:name,role:'agent',content:t,round_index:currentRound,model_id:''});
    i++;if(i<phils.length)setTimeout(speakNext,800);else setTimeout(()=>{waitingForUser=true;setUserInputEnabled(true);renderTiles(null);$('#input').focus();showSuggestions();},500);
  }
  setTimeout(speakNext,300);
}

function showSuggestions(){
  let suggestions=suggestionsList[n]||['请发表你的观点','你有什么想法？','说说你的看法'];
  $('#suggestions').innerHTML=suggestions.map(x=>`<button class="suggestion">${x}</button>`).join('');
  $$('.suggestion').forEach(b=>b.onclick=()=>{$('#input').value=b.textContent;submitUser(false);});
}

function submitUser(skip){
  if(!waitingForUser||!gameRunning)return;
  let v=skip?'我暂时没有答案，先听听其他人怎么说。':$('#input').value.trim();
  if(!v&&!skip)return;
  waitingForUser=false;setUserInputEnabled(false);$('#input').value='';$('#suggestions').innerHTML='';
  if(!skip)trackChoice(v);
  history.push({agent_id:'user',agent_name:'你',role:'user',content:v,round_index:currentRound,model_id:''});
  chat('你',v);
  currentRound++;storyPhase++;
  if(storyPhase===1){
    // Phase 1 done: user responded, now let agents respond to user
    setTimeout(()=>{if(gameRunning)startSession()},500);
  } else {
    // Phase 2 done: agents responded to user, move to next story
    setTimeout(()=>{
      if(n<9){n++;storyPhase=0;renderStory();philosopherTexts={};renderTiles();if(gameRunning)startSession();}
      else finish();
    },500);
  }
}

function trackChoice(text){
  let weights={aristotle:0,zhuangzi:0,hanfeizi:0,schopenhauer:0};
  let kws={aristotle:['行动','实践','判断','德性','选择','坚持','理性','权衡','原则','公平','正义'],zhuangzi:['角度','变化','自在','自然','相对','超脱','放下','包容','多元','语境'],hanfeizi:['现实','局势','果断','冷静','利益','冲突','实力','法治','权力','制度'],schopenhauer:['欲望','痛苦','理性','意志','悲观','力量','恐惧','本能','驱动','人性']};
  for(let [agent,words] of Object.entries(kws)){for(let w of words){if(text.includes(w))weights[agent]+=2}}
  if(text.includes('不')||text.includes('没'))weights.zhuangzi+=1;
  if(text.includes('应该')||text.includes('必须'))weights.hanfeizi+=1;
  if(text.includes('感觉')||text.includes('觉得'))weights.schopenhauer+=1;
  if(text.includes('因为')||text.includes('所以'))weights.aristotle+=1;
  for(let [k,v] of Object.entries(weights)){playerChoiceWeights[k]=(playerChoiceWeights[k]||0)+v}
}

function startGame(){
  gameRunning=true;n=0;history=[];sessionId=null;playerChoiceWeights={};currentRound=1;storyPhase=0;philosopherTexts={};
  $('#chat').innerHTML='';renderStory();setUserInputEnabled(false);
  startSession();
}

function finish(){
  gameRunning=false;if(abortController)abortController.abort();
  let best='zhuangzi',bestScore=0;
  for(let [k,v] of Object.entries(playerChoiceWeights)){if(v>bestScore){bestScore=v;best=k}}
  let names={aristotle:'亚里士多德',zhuangzi:'庄子',hanfeizi:'韩非子',schopenhauer:'叔本华'};
  let descs={aristotle:'你注重实践和判断，在行动中寻找答案。',zhuangzi:'你习惯从既定答案之外重新看问题，也愿意为不确定性留下空间。',hanfeizi:'你务实冷静，相信看清局势比空谈理想更重要。',schopenhauer:'你对人性有深刻洞察，不回避痛苦与欲望的真实。'};
  $('#resultMatch').textContent='你最接近：'+(names[best]||'庄子');
  $('#resultDesc').textContent=descs[best]||'你习惯从既定答案之外重新看问题，也愿意为不确定性留下空间。';
  $('#finish').classList.add('show');
}

function restart(){$('#finish').classList.remove('show');startGame()}
function finishRestart(){location.reload()}

async function init(){
  try{let r=await fetch('/api/health');let j=await r.json();if(j.status!=='ok')throw new Error('API not healthy')}catch(e){}
  await fetchAgents();renderStory();renderTiles();setTimeout(startGame,500);
}
init();
</script>
