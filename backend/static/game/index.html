<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稷下 · 论语圆桌</title>
<link rel="stylesheet" href="/static/game/game.css?v=20260810-speak2">
</head>
<body>

<!-- ═══ 开始页 ═══ -->
<section id="screen-start" class="screen active">
  <div class="start-card">
    <div class="start-seal">稷下</div>
    <h1>稷下 · 论语圆桌</h1>
    <p class="start-sub">让《论语》重新吵起来</p>
    <div class="start-rule"></div>
    <p class="start-desc">
      <span id="story-count">三篇《论语》· 一场语音圆桌</span><br>
      孔子在场，反对过他的人也在场。<br>
      <b>你随时可以开口。</b>
    </p>
    <button class="btn-primary" id="btn-to-select">入 场</button>
    <p class="start-note" id="health-note">…</p>
  </div>
</section>

<!-- ═══ 选哲学家 ═══ -->
<section id="screen-select" class="screen">
  <div class="select-wrap">
    <h2>请入席 <span class="select-hint">选 1–4 位同桌 · 孔子已在主位</span></h2>
    <div class="pick-grid" id="pick-grid"></div>
    <div class="select-stories" id="story-list"></div>
    <button class="btn-primary" id="btn-start-game" disabled>开始圆桌</button>
  </div>
</section>

<!-- ═══ 共享讲席 ═══ -->
<section id="screen-table" class="screen">
  <header class="topbar">
    <div class="tb-left">
      <span class="tb-logo">稷下 · 论语圆桌</span>
      <span class="tb-story" id="tb-story"></span>
      <span class="tb-live">进行中</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="stage-bg"></div>

    <!-- 竹卷轴讲席（导读 PPT / 议题投屏） -->
    <section class="story-deck" id="story-deck" aria-label="故事讲席">
      <img class="deck-frame" src="/static/assets/ui/gpt2/scroll-frame.png" alt="">
      <div class="deck-paper">
        <div class="deck-head">
          <span class="deck-status" id="deck-status">主持人讲述中</span>
          <span class="deck-head-ctas">
            <button class="deck-cta" id="btn-original-deck">原文</button>
            <button class="deck-cta" id="btn-skip-brief">跳过导读</button>
          </span>
        </div>

        <div class="deck-body">
          <!-- 左：竖排标题 + 朱印 + 竖排出处 -->
          <aside class="deck-side">
            <h2 class="deck-title-v" id="deck-title"></h2>
            <img class="deck-seal" src="/static/assets/ui/seal-stamp.png" alt="">
            <div class="deck-source-v" id="deck-source"></div>
          </aside>

          <!-- 中：配图（第四页无图时收起） -->
          <div class="deck-visual" id="deck-visual" title="点击放大查看">
            <img id="deck-img" alt="故事插画">
            <span class="zoom-hint">点击放大</span>
          </div>

          <!-- 右：正文 -->
          <div class="deck-copy">
            <p class="deck-narrative" id="deck-narrative"></p>
          </div>
        </div>

        <!-- 翻页条：居中 -->
        <div class="deck-pager">
          <button class="deck-page" id="btn-deck-prev" title="上一页（←）">‹</button>
          <span class="deck-pageno" id="deck-phase">1 / 4</span>
          <div class="deck-dots" id="deck-dots"><i></i><i></i><i></i><i></i></div>
          <button class="deck-page" id="btn-deck-next" title="下一页（→）">›</button>
        </div>

        <!-- 底：主持人讲述条，通栏 -->
        <div class="deck-narration" id="deck-narration">
          <span id="deck-narration-name">主持人</span><b id="deck-narration-text"></b>
        </div>
      </div>
    </section>

    <div id="chars"></div>
    <div class="bubble" id="bubble"><div class="bubble-name" id="bubble-name"></div><div class="bubble-text" id="bubble-text"></div></div>
    <div class="think" id="think"></div>
    <div class="user-cue" id="user-cue">
      <span>轮到你了</span><i id="cue-count">60 秒</i>
      <button id="btn-skip-cue">跳过</button>
    </div>
  </main>

  <footer class="meeting-dock">
    <div class="speech-tray" id="speech-tray" aria-hidden="true">
      <div class="suggestion-list" id="suggestion-list" aria-label="推荐发言"></div>
      <div class="utterance-box">
        <button class="dock-control mic" id="btn-mic" title="语音发言（点一下开始，说完点结束）"><span class="control-signet" id="mic-label">语音</span></button>
        <div class="input-shell" id="input-shell">
          <span class="rec-badge" id="rec-badge">录音中<b id="rec-time">0:00</b></span>
          <span class="mention-chip" id="mention-chip"><em>@</em><b id="mention-name"></b><i id="mention-clear" title="取消点名">✕</i></span>
          <input id="user-input" type="text" maxlength="120" placeholder="说出你的想法；点击哲学家可点名提问…" autocomplete="off">
        </div>
        <button class="dock-control btn-send" id="btn-send">发送</button>
        <button class="dock-control btn-interrupt" id="btn-interrupt">打断</button>
        <button class="tray-close" id="btn-speech-close" title="收起发言区">收起</button>
      </div>
    </div>
    <div class="meeting-toolbar">
      <div class="toolbar-group toolbar-left">
        <button class="dock-control" id="btn-mute" title="关闭声音"><span class="control-signet">声音</span><span class="control-label">开启</span></button>
        <button class="dock-control" id="btn-pause" title="暂停"><span class="control-signet">暂停</span><span class="control-label">流程</span></button>
        <button class="dock-control" id="btn-original"><span class="control-signet">原文</span></button>
        <button class="dock-control" id="btn-skip-turn" title="跳过当前发言，换下一位"><span class="control-signet">下一位</span></button>
        <button class="dock-control" id="btn-skip-story" title="跳过本篇，直接进入下一个故事"><span class="control-signet">下一篇</span></button>
      </div>
      <button class="speak-primary" id="btn-speak-open" aria-expanded="false"><span>我要发言</span><small>文字或语音</small></button>
      <div class="toolbar-group toolbar-right">
        <button class="dock-control" id="btn-log" title="对话记录"><span class="control-signet">记录</span><b id="log-count">0</b></button>
        <button class="dock-control danger" id="btn-leave">结束会议</button>
      </div>
    </div>
  </footer>

  <!-- 对话记录抽屉 -->
  <div class="drawer" id="drawer">
    <div class="drawer-head">对话记录 <button id="btn-drawer-close">✕</button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>

  <!-- 插画灯箱 -->
  <div class="modal lightbox" id="modal-image">
    <div class="lightbox-inner">
      <img id="lightbox-img" alt="故事插画大图">
      <button class="btn-ghost" id="btn-image-close">合上</button>
    </div>
  </div>

  <!-- 原文弹窗 -->
  <div class="modal" id="modal-original">
    <div class="modal-card">
      <div class="modal-head" id="orig-source"></div>
      <div class="orig-text" id="orig-text"></div>
      <div class="orig-note" id="orig-note"></div>
      <button class="btn-ghost" id="btn-orig-close">合上</button>
    </div>
  </div>
</section>

<!-- ═══ 终局报告 ═══ -->
<section id="screen-report" class="screen">
  <div class="report-wrap" id="report-wrap">
    <p class="report-loading">主持人正在为你写终局报告…</p>
  </div>
</section>

<script src="/static/game/game.js?v=20260810-speak2"></script>
</body>
</html>
