<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPT-Image-2 UI 资产审阅 · 稷下论语圆桌</title>
  <style>
    :root { --ink:#30281d; --muted:#7b6b51; --paper:#f4ecd9; --sage:#49675b; --terra:#a65334; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:"Songti SC","STSong",serif; background:#201b15; }
    header { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
      min-height:52px; padding:8px 22px; color:#f4ead5; background:rgba(26,21,16,.94); border-bottom:1px solid #69543b; }
    header h1 { margin:0; font-size:18px; letter-spacing:3px; }
    header a { color:#e5cda4; text-decoration:none; font-size:13px; }
    main { width:min(1500px,96vw); margin:24px auto 60px; }
    .section-title { display:flex; align-items:baseline; gap:12px; margin:28px 0 12px; color:#f4ead5; }
    .section-title h2 { margin:0; font-size:19px; letter-spacing:2px; }
    .section-title span { color:#af9d80; font-size:12px; }
    .assembly { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#ddd;
      box-shadow:0 18px 50px rgba(0,0,0,.42); }
    .assembly-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .assembly-top { position:absolute; z-index:3; inset:0 0 auto; height:3.7%; background:url('/static/assets/ui/gpt2/title-strip.png') center/100% 100% no-repeat; }
    .assembly-top b { display:block; padding:.6% 1.6%; font-size:clamp(8px,1.2vw,18px); letter-spacing:3px; }
    .assembly-scroll { position:absolute; z-index:4; top:4.4%; left:50%; width:64.2%; aspect-ratio:1916/771;
      transform:translateX(-50%); background:url('/static/assets/ui/gpt2/scroll-frame.png') center/100% 100% no-repeat; }
    .slide { position:absolute; inset:14% 5% 13%; min-height:0; overflow:hidden; display:grid; grid-template-columns:52% 1fr; gap:3%; padding:1.5% 2.5%; }
    .slide img { width:100%; height:100%; min-height:0; object-fit:cover; object-position:center 14%; border:1px solid rgba(96,72,38,.35); }
    .slide-copy { min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
    .slide-copy small { color:var(--terra); letter-spacing:2px; }
    .slide-copy h3 { margin:4% 0 5%; font-size:clamp(14px,3vw,40px); letter-spacing:4px; }
    .slide-copy p { margin:0; color:#5d503d; font-size:clamp(8px,1.3vw,18px); line-height:1.8; }
    .people { position:absolute; z-index:5; left:10%; right:10%; bottom:8.3%; height:43%; display:flex; justify-content:space-between; align-items:flex-end; }
    .person { position:relative; width:21%; height:100%; }
    .person .sprite { position:absolute; left:50%; bottom:7%; width:100%; aspect-ratio:307/341; transform:translateX(-50%);
      background-size:500% 300%; background-position:0 0; background-repeat:no-repeat; filter:drop-shadow(0 8px 7px rgba(20,15,8,.35)); }
    .person .plaque { position:absolute; left:50%; bottom:0; width:76%; aspect-ratio:1699/570; transform:translateX(-50%);
      display:grid; place-items:center; padding-bottom:1%; background:url('/static/assets/ui/gpt2/name-plaque.png') center/100% 100% no-repeat;
      font-size:clamp(7px,1.15vw,15px); white-space:nowrap; }
    .assembly-toolbar { position:absolute; z-index:6; inset:auto 0 0; height:8.3%; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
      padding:0 3%; background:url('/static/assets/ui/gpt2/toolbar-strip.png') center/100% 100% no-repeat; }
    .tool-group { display:flex; gap:2%; align-items:center; }
    .tool-group.right { justify-content:flex-end; }
    .skin-button { border:0; color:#f3e7cf; min-width:96px; height:38px; background:url('/static/assets/ui/gpt2/button-secondary.png') center/100% 100% no-repeat;
      font-family:inherit; letter-spacing:2px; }
    .skin-button.primary { width:220px; color:#fff1db; background-image:url('/static/assets/ui/gpt2/button-primary.png'); font-size:15px; }
    .asset-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
    .asset-card { min-height:180px; padding:14px; background:#eee4ce; border:1px solid #6b5435; border-radius:10px; overflow:hidden; }
    .asset-card h3 { margin:0 0 10px; font-size:14px; letter-spacing:2px; }
    .checker { display:grid; place-items:center; min-height:130px; padding:12px;
      background-color:#ddd3bc; background-image:linear-gradient(45deg,#c9bea8 25%,transparent 25%),linear-gradient(-45deg,#c9bea8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#c9bea8 75%),linear-gradient(-45deg,transparent 75%,#c9bea8 75%);
      background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
    .checker img { display:block; max-width:100%; max-height:210px; object-fit:contain; filter:drop-shadow(0 5px 7px rgba(0,0,0,.2)); }
    .wide { grid-column:1/-1; }
    .wide .checker { min-height:230px; }
    .bubble-demo { position:relative; width:min(360px,94%); padding:18px 20px 20px; border:1px solid rgba(72,66,56,.18);
      border-radius:16px; background:rgba(255,255,255,.97); box-shadow:0 9px 26px rgba(32,27,20,.17); }
    .bubble-demo::after { content:''; position:absolute; left:50%; bottom:-8px; width:15px; height:15px;
      background:#fff; border-right:1px solid rgba(72,66,56,.18); border-bottom:1px solid rgba(72,66,56,.18);
      transform:translateX(-50%) rotate(45deg); }
    .bubble-demo b { color:var(--sage); }
    .bubble-demo p { margin:6px 0 0; line-height:1.75; font-size:14px; }
    @media(max-width:900px) { .skin-button { min-width:72px; height:32px; font-size:10px; } .skin-button.primary { width:150px; font-size:12px; } }
  </style>
</head>
<body>
  <header><h1>GPT‑Image‑2 · UI 资产审阅</h1><a href="/game#select">进入游戏 →</a></header>
  <main>
    <div class="section-title"><h2>整屏组装预览</h2><span>同一批独立资产，按最终比例实时拼装</span></div>
    <section class="assembly">
      <img class="assembly-bg" src="/static/assets/ui/gpt2/stage-garden.png" alt="淡墨园林舞台背景">
      <div class="assembly-top"><b>稷下 · 论语圆桌</b></div>
      <div class="assembly-scroll">
        <div class="slide">
          <img src="/static/assets/theater/s1.png" alt="一只羊故事插画">
          <div class="slide-copy"><small>故事导读 1/3 · 《论语·子路》13.18</small><h3>羊入后院</h3><p>一只羊从邻家的破篱笆走进院子。父亲看了许久，没有归还，反把它牵进后棚。</p></div>
        </div>
      </div>
      <div class="people">
        <div class="person"><div class="sprite" style="background-image:url('/static/assets/sprites/kongzi-ia.png')"></div><div class="plaque">孔子 · 义与关系</div></div>
        <div class="person"><div class="sprite" style="background-image:url('/static/assets/sprites/hanfeizi-ia.png')"></div><div class="plaque">韩非子 · 法与权术</div></div>
        <div class="person"><div class="sprite" style="background-image:url('/static/assets/sprites/kant-ia.png')"></div><div class="plaque">康德 · 原则与义务</div></div>
        <div class="person"><div class="sprite" style="background-image:url('/static/assets/sprites/player-ia.png')"></div><div class="plaque">你 · 参与者</div></div>
      </div>
      <div class="assembly-toolbar">
        <div class="tool-group"><button class="skin-button">静音</button><button class="skin-button">暂停</button><button class="skin-button">原文</button></div>
        <button class="skin-button primary">我要发言</button>
        <div class="tool-group right"><button class="skin-button">对话记录</button><button class="skin-button">结束会议</button></div>
      </div>
    </section>

    <div class="section-title"><h2>独立资产</h2><span>透明边缘与缩放状态检查</span></div>
    <section class="asset-grid">
      <article class="asset-card wide"><h3>竹轴 PPT 框架</h3><div class="checker"><img src="/static/assets/ui/gpt2/scroll-frame.png" alt="竹轴 PPT 框架"></div></article>
      <article class="asset-card wide"><h3>极薄标题条</h3><div class="checker"><img src="/static/assets/ui/gpt2/title-strip.png" alt="标题条"></div></article>
      <article class="asset-card wide"><h3>底部桌案操作条</h3><div class="checker"><img src="/static/assets/ui/gpt2/toolbar-strip.png" alt="底部操作条"></div></article>
      <article class="asset-card"><h3>主操作按钮</h3><div class="checker"><img src="/static/assets/ui/gpt2/button-primary.png" alt="主按钮"></div></article>
      <article class="asset-card"><h3>次操作按钮</h3><div class="checker"><img src="/static/assets/ui/gpt2/button-secondary.png" alt="次按钮"></div></article>
      <article class="asset-card"><h3>人物名牌</h3><div class="checker"><img src="/static/assets/ui/gpt2/name-plaque.png" alt="人物名牌"></div></article>
      <article class="asset-card"><h3>展开式发言托盘</h3><div class="checker"><img src="/static/assets/ui/gpt2/input-tray.png" alt="发言托盘"></div></article>
      <article class="asset-card"><h3>白底头顶对齐台词气泡</h3><div class="checker"><div class="bubble-demo"><b>孔子</b><p>人之为直，不在一时逞快，而在不欺其心。</p></div></div></article>
      <article class="asset-card wide"><h3>淡墨园林舞台背景</h3><div class="checker"><img src="/static/assets/ui/gpt2/stage-garden.png" alt="园林背景"></div></article>
    </section>
  </main>
</body>
</html>
