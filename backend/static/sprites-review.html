<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>雪碧图审阅 · 稷下</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f6f2e8; color: #2f3430; font-family: "Songti SC","STSong",serif; padding: 36px 5vw; }
h1 { font-size: 26px; letter-spacing: 6px; }
.sub { color: #6f6f63; font-size: 13px; margin: 8px 0 22px; }
.controls { display: flex; gap: 16px; align-items: center; margin-bottom: 26px; font-size: 14px;
  background: #fbf8f0; border: 1px solid #ddd5c2; border-radius: 12px; padding: 12px 18px; width: fit-content; }
.controls input[type=range] { width: 180px; accent-color: #3d5940; }
.row { display: grid; grid-template-columns: 150px 1fr 260px; gap: 22px; align-items: center;
  background: #fbf8f0; border: 1px solid #ddd5c2; border-radius: 14px; padding: 18px 22px; margin-bottom: 16px; }
.meta b { font-size: 19px; display: block; }
.meta span { font-size: 12px; color: #6f6f63; }
.meta i { font-style: normal; display: block; margin-top: 6px; font-size: 11px; color: #a9a390; }
.sheet { position: relative; }
.sheet img { width: 100%; border-radius: 8px; display: block; }
.sheet::after { content: '原始绿幕 10帧 (2×5)'; position: absolute; top: 8px; left: 8px; font-size: 11px;
  background: rgba(0,0,0,.55); color: #fff; padding: 2px 8px; border-radius: 5px; }
.live { display: flex; align-items: flex-end; justify-content: center; gap: 0; height: 240px;
  background: url('/static/assets/bg/garden.png') center/cover; border-radius: 10px; overflow: hidden; position: relative; }
.live::after { content: '抠图后 · 实时动画'; position: absolute; top: 8px; left: 8px; font-size: 11px;
  background: rgba(61,89,64,.8); color: #fff; padding: 2px 8px; border-radius: 5px; }
.anim { width: 126px; height: 210px; background-size: 500% 200%; background-position: 0 0;
  filter: drop-shadow(0 8px 8px rgba(50,60,40,.3)); margin-bottom: 4px; }
</style>
</head>
<body>
<h1>雪碧图审阅页</h1>
<div class="sub">6 位哲学家 · GPT-Image-2 生成 10 帧绿幕雪碧图 → 本地色键抠图 → 帧步进动画（已实装进 /game）</div>
<div class="controls">
  帧率 <input type="range" id="fps" min="2" max="12" value="6"> <b id="fpsv">6</b> fps
  <button id="toggle" style="font-family:inherit;padding:5px 14px;border:1px solid #ddd5c2;border-radius:7px;background:#fff;cursor:pointer">⏸ 暂停</button>
</div>
<div id="rows"></div>
<script>
const CAST = [
  ['kongzi','孔子','捋须 · 颔首 · 抬手示意'],
  ['socrates','苏格拉底','前倾 · 摊手发问 · 竖指'],
  ['hanfeizi','韩非子','抱臂 · 冷眼 · 切掌'],
  ['kant','康德','抿茶 · 竖指强调 · 浅笑'],
  ['laozi','老子','近乎不动 · 袖摆 · 睁闭眼'],
  ['zhuangzi','庄子','笑 · 挥袖 · 指蝴蝶'],
];
const rows = document.getElementById('rows');
CAST.forEach(([id,name,gest]) => {
  rows.insertAdjacentHTML('beforeend', `
    <div class="row">
      <div class="meta"><b>${name}</b><span>${gest}</span><i>sprites/${id}.png · sprites/raw/${id}-green.png</i></div>
      <div class="sheet"><img src="/static/assets/sprites/raw/${id}-green.png"></div>
      <div class="live"><div class="anim" style="background-image:url('/static/assets/sprites/${id}.png')"></div></div>
    </div>`);
});
let fps = 6, playing = true, f = 0, last = 0;
requestAnimationFrame(function loop(now) {
  if (playing && now - last >= 1000 / fps) {
    last = now;
    f = (f + 1) % 10;
    document.querySelectorAll('.anim').forEach(el =>
      el.style.backgroundPosition = `${(f % 5) * 25}% ${f < 5 ? 0 : 100}%`);
  }
  requestAnimationFrame(loop);
});
document.getElementById('fps').oninput = (e) => { fps = +e.target.value; document.getElementById('fpsv').textContent = fps; };
document.getElementById('toggle').onclick = (e) => {
  playing = !playing;
  e.target.textContent = playing ? '⏸ 暂停' : '▶ 播放';
};
</script>
</body>
</html>
